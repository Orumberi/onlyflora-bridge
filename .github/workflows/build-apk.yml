name: Build OnlyFlora Android release

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "!android-app/store-assets/**"
      - "!android-app/STORE_RELEASE.md"
      - "!android-app/README.md"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output "$RUNNER_TEMP/android-command-line-tools.zip"
          unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: onlyflora-android-debug-keystore-v1

      - name: Prepare stable test signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=OnlyFlora Test,O=OnlyFlora,C=RU"
          fi

      - name: Build installable test APK
        run: |
          gradle -p android-app :app:assembleDebug \
            -PONLYFLORA_APP_URL="https://app.onlyflora.ru/?source=android" \
            --no-daemon --stacktrace
          mkdir -p test-release
          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
            test-release/OnlyFlora-1.0.0-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OnlyFlora-1.0.0-test-apk
          path: test-release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK at stable download URL
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p downloads
          cp test-release/OnlyFlora-1.0.0-test.apk \
            downloads/OnlyFlora-1.0.0-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/OnlyFlora-1.0.0-test.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(android): publish OnlyFlora 1.0.0 test APK [skip ci]"
          git push

      - name: Restore OnlyFlora release key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onlyflora-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/onlyflora-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        run: |
          gradle -p android-app \
            :app:assembleRelease :app:bundleRelease \
            -PONLYFLORA_APP_URL="https://app.onlyflora.ru/?source=android" \
            --no-daemon --stacktrace

      - name: Collect release files
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        run: |
          mkdir -p release
          cp android-app/app/build/outputs/apk/release/app-release.apk \
            release/OnlyFlora-1.0.0.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab \
            release/OnlyFlora-1.0.0.aab
          sha256sum release/* > release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        with:
          name: OnlyFlora-1.0.0-store-release
          path: release/
          if-no-files-found: error
          retention-days: 90
