name: Build OnlyFlora APK

on:
  push:
    branches: [apk-build-v1]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output "$RUNNER_TEMP/android-command-line-tools.zip"
          unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Use the approved OnlyFlora icon
        run: |
          rm android-app/app/src/main/res/drawable/onlyflora_icon.xml
          curl --fail --location --retry 3 \
            https://onlyflora-mobile.silver-tapir-1656.chatgpt.site/assets/icon-512-v2.png \
            --output android-app/app/src/main/res/drawable/onlyflora_icon.png
      - name: Build APK
        run: gradle -p android-app :app:assembleDebug --no-daemon --stacktrace
      - name: Name APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk OnlyFlora-1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OnlyFlora-1.1-apk
          path: OnlyFlora-1.1.apk
          if-no-files-found: error
          retention-days: 30
