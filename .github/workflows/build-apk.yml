name: Build OnlyFlora Android release

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "!android-app/store-assets/**"
      - "!android-app/STORE_RELEASE.md"
      - "!android-app/README.md"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output "$RUNNER_TEMP/android-command-line-tools.zip"
          unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Require OnlyFlora production signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Restore OnlyFlora production signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onlyflora-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/onlyflora-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: |
          gradle -p android-app \
            :app:assembleRelease :app:bundleRelease \
            -PONLYFLORA_APP_URL="https://app.onlyflora.ru/?source=android" \
            --no-daemon --stacktrace

      - name: Collect release files
        run: |
          mkdir -p release
          cp android-app/app/build/outputs/apk/release/app-release.apk \
            release/OnlyFlora-1.0.4.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab \
            release/OnlyFlora-1.0.4.aab
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Verify production APK signing certificate
        run: |
          fingerprint="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --print-certs release/OnlyFlora-1.0.4.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "Production signing certificate SHA-256: $fingerprint"
          test "$fingerprint" = "ff10f2c63fa74f958cafcdd9cfcbcc79c3de14a816b93abdba88d1e3df58159b"

      - uses: actions/upload-artifact@v4
        with:
          name: OnlyFlora-1.0.4-store-release
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish production APK at stable download URL
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p downloads
          cp release/OnlyFlora-1.0.4.apk downloads/OnlyFlora.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/OnlyFlora.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(android): publish OnlyFlora 1.0.4 production APK"
          git push
