name: Deploy OnlyFlora Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mobile.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: onlyflora-mobile-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare static application
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://app.onlyflora.ru"
          mkdir -p public
          files=(
            app.js catalog-index.json index.html manifest.webmanifest offers-snapshot.json styles.css sw.js
            assets/logo.svg assets/icon-192-v2.png assets/icon-192.png assets/icon-512-v2.png assets/icon-512.png
            assets/marketplace-hero-autumn.webp assets/product-placeholder.webp
            assets/category-bird-cherry-v2.webp assets/category-bird-cherry.webp assets/category-conifers.webp
            assets/category-deciduous.webp assets/category-euonymus.webp assets/category-fruits.webp assets/category-grasses.webp
            assets/category-hedges.webp assets/category-perennials.webp assets/category-roses.webp assets/category-shrubs.webp
            assets/category-topiary-v2.webp assets/category-topiary-v3.webp assets/category-topiary.webp
            assets/sub-apple.webp assets/sub-ash.webp assets/sub-autumn-tree.webp assets/sub-birch.webp assets/sub-cherry.webp
            assets/sub-elm.webp assets/sub-linden.webp assets/sub-maple-v2.webp assets/sub-maple.webp assets/sub-oak.webp
            assets/sub-other-deciduous.webp assets/sub-poplar.webp assets/sub-rowan.webp assets/sub-willow.webp
            assets/categories/barbarisy.webp assets/categories/beresklet.webp assets/categories/boyaryshnik.webp
            assets/categories/chubushnik.webp assets/categories/drugie-kustarniki.webp assets/categories/dyoren.webp
            assets/categories/eli.webp assets/categories/gortenziya.webp assets/categories/kalina.webp
            assets/categories/khvoynye.webp assets/categories/kizilnik.webp assets/categories/kustarniki.webp
            assets/categories/lapchatka.webp assets/categories/listvennitsa.webp assets/categories/mozhzhevelnik.webp
            assets/categories/puzyreplodnik.webp assets/categories/siren.webp assets/categories/sosna.webp
            assets/categories/spireya.webp assets/categories/veygela.webp assets/categories/zhimolost.webp
          )
          for file in "${files[@]}"; do
            mkdir -p "public/$(dirname "$file")"
            curl --fail --location --retry 4 --retry-delay 3 --user-agent "OnlyFlora-Deploy/1.0" "$source_url/$file" -o "public/$file"
          done

          # GitHub Pages is static, while live offers are served by the Timeweb bridge.
          # Patch the downloaded client and rotate the service-worker cache.
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("public/app.js")
          app = app_path.read_text(encoding="utf-8")
          function_needle = "async function jsonRequest(url, options={}){"
          if function_needle not in app:
              raise SystemExit("jsonRequest insertion point was not found in app.js")

          # Remove an older injected resolver before adding the canonical one.
          app = re.sub(
              r"const ONLYFLORA_BRIDGE_API = .*?\nfunction resolveOnlyFloraApiUrl\(url\)\{.*?\n\}\n",
              "",
              app,
              count=1,
              flags=re.S,
          )
          bridge = """const ONLYFLORA_API_ORIGIN = 'https://orumberi-onlyflora-bridge-4b6b.twc1.net';
          function resolveOnlyFloraApiUrl(url){
            if(url.startsWith('/api/egor/')) return ONLYFLORA_API_ORIGIN + '/egor/api/' + url.slice('/api/egor/'.length);
            if(url.startsWith('/api/')) return ONLYFLORA_API_ORIGIN + '/mobile/api/' + url.slice('/api/'.length);
            return url;
          }
          """
          app = app.replace(function_needle, bridge + function_needle, 1)

          # Re-patch jsonRequest idempotently.
          app = app.replace("fetch(resolveOnlyFloraApiUrl(url),", "fetch(url,", 1)
          app = app.replace("fetch(url,", "fetch(resolveOnlyFloraApiUrl(url),", 1)

          catalog_calls = {
              "fetch(`/api/catalog?query=${encodeURIComponent(used)}`,": "fetch(resolveOnlyFloraApiUrl(`/api/catalog?query=${encodeURIComponent(used)}`),",
              "fetch(`/api/catalog?query=${encodeURIComponent(raw)}`,": "fetch(resolveOnlyFloraApiUrl(`/api/catalog?query=${encodeURIComponent(raw)}`),",
          }
          for old, new in catalog_calls.items():
              app = app.replace(old, new)

          if "/mobile/api/" not in app:
              raise SystemExit("mobile API resolver was not added to app.js")
          app_path.write_text(app, encoding="utf-8")

          index_path = Path("public/index.html")
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(r"app\.js\?v=\d+", "app.js?v=30", index)
          index_path.write_text(index, encoding="utf-8")

          sw_path = Path("public/sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = re.sub(r"onlyflora-mobile-v\d+", "onlyflora-mobile-v38", sw)
          sw = re.sub(r"app\.js\?v=\d+", "app.js?v=30", sw)
          network_only = "if(new URL(event.request.url).origin!==self.location.origin){event.respondWith(fetch(event.request));return}\n  "
          if network_only not in sw:
              sw = sw.replace("if(event.request.method!=='GET')return;\n  ", "if(event.request.method!=='GET')return;\n  " + network_only, 1)
          sw_path.write_text(sw, encoding="utf-8")
          PY
          touch public/.nojekyll
          printf '%s\n' 'app.onlyflora.ru' > public/CNAME
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload application
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
