name: Deploy OnlyFlora Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mobile.yml"
      - "mobile-static/**"
      - "downloads/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: onlyflora-mobile-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static application
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://app.onlyflora.ru"
          mkdir -p public
          files=(
            app.js catalog-index.json index.html manifest.webmanifest offers-snapshot.json styles.css sw.js
            assets/logo.svg assets/icon-192-v2.png assets/icon-192.png assets/icon-512-v2.png assets/icon-512.png
            assets/marketplace-hero-autumn.webp assets/product-placeholder.webp
            assets/category-bird-cherry-v2.webp assets/category-bird-cherry.webp assets/category-conifers.webp
            assets/category-deciduous.webp assets/category-euonymus.webp assets/category-fruits.webp assets/category-grasses.webp
            assets/category-hedges.webp assets/category-perennials.webp assets/category-roses.webp assets/category-shrubs.webp
            assets/category-topiary-v2.webp assets/category-topiary-v3.webp assets/category-topiary.webp
            assets/sub-apple.webp assets/sub-ash.webp assets/sub-autumn-tree.webp assets/sub-birch.webp assets/sub-cherry.webp
            assets/sub-elm.webp assets/sub-linden.webp assets/sub-maple-v2.webp assets/sub-maple.webp assets/sub-oak.webp
            assets/sub-other-deciduous.webp assets/sub-poplar.webp assets/sub-rowan.webp assets/sub-willow.webp
            assets/categories/barbarisy.webp assets/categories/beresklet.webp assets/categories/boyaryshnik.webp
            assets/categories/chubushnik.webp assets/categories/drugie-kustarniki.webp assets/categories/dyoren.webp
            assets/categories/eli.webp assets/categories/gortenziya.webp assets/categories/kalina.webp
            assets/categories/khvoynye.webp assets/categories/kizilnik.webp assets/categories/kustarniki.webp
            assets/categories/lapchatka.webp assets/categories/listvennitsa.webp assets/categories/mozhzhevelnik.webp
            assets/categories/puzyreplodnik.webp assets/categories/siren.webp assets/categories/sosna.webp
            assets/categories/spireya.webp assets/categories/veygela.webp assets/categories/zhimolost.webp
          )
          for file in "${files[@]}"; do
            mkdir -p "public/$(dirname "$file")"
            curl --fail --location --retry 4 --retry-delay 3 --user-agent "OnlyFlora-Deploy/1.0" "$source_url/$file" -o "public/$file"
          done

          # GitHub Pages is static, while live offers are served by the Timeweb bridge.
          # Patch the downloaded client and rotate the service-worker cache.
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("public/app.js")
          app = app_path.read_text(encoding="utf-8")
          function_needle = "async function jsonRequest(url, options={}){"
          if function_needle not in app:
              raise SystemExit("jsonRequest insertion point was not found in app.js")

          # Remove every resolver injected by older deployments before adding
          # exactly one canonical block. The source is the previously deployed
          # application, so this cleanup must remain idempotent.
          app = re.sub(
              r"const ONLYFLORA_(?:BRIDGE_API|API_ORIGIN) = .*?\nfunction resolveOnlyFloraApiUrl\(url\)\{.*?\n\}\n",
              "",
              app,
              flags=re.S,
          )
          bridge = """const ONLYFLORA_API_ORIGIN = 'https://orumberi-onlyflora-bridge-4b6b.twc1.net';
          function resolveOnlyFloraApiUrl(url){
            if(url.startsWith('/api/egor/')) return ONLYFLORA_API_ORIGIN + '/egor/api/' + url.slice('/api/egor/'.length);
            if(url.startsWith('/api/')) return ONLYFLORA_API_ORIGIN + '/mobile/api/' + url.slice('/api/'.length);
            return url;
          }
          """
          app = app.replace(function_needle, bridge + function_needle, 1)

          android_class = "if(/OnlyFloraAndroid\\//.test(navigator.userAgent))document.documentElement.classList.add('onlyflora-android');\n"
          app = app.replace(android_class, "")
          app = android_class + app

          # Re-patch jsonRequest idempotently.
          app = app.replace("fetch(resolveOnlyFloraApiUrl(url),", "fetch(url,", 1)
          app = app.replace("fetch(url,", "fetch(resolveOnlyFloraApiUrl(url),", 1)

          catalog_calls = {
              "fetch(`/api/catalog?query=${encodeURIComponent(used)}`,": "fetch(resolveOnlyFloraApiUrl(`/api/catalog?query=${encodeURIComponent(used)}`),",
              "fetch(`/api/catalog?query=${encodeURIComponent(raw)}`,": "fetch(resolveOnlyFloraApiUrl(`/api/catalog?query=${encodeURIComponent(raw)}`),",
          }
          for old, new in catalog_calls.items():
              app = app.replace(old, new)

          # Collapse duplicate Shop-Script product cards into one plant card.
          # The underlying master products remain available as variants so the
          # product screen can collect every price, size and nursery offer.
          app = re.sub(
              r"/\* ONLYFLORA_GROUPING_START \*/.*?/\* ONLYFLORA_GROUPING_END \*/\n",
              "",
              app,
              flags=re.S,
          )
          grouping = r'''/* ONLYFLORA_GROUPING_START */
          function productGroupKey(product){
            return normalize(product?.name).replace(/[«»"'`´]/g,'').replace(/\s+/g,' ').trim();
          }
          function productNumericPrice(product){
            const direct=Number(product?.price||0);
            if(direct>0)return direct;
            const digits=String(product?.priceText||'').replace(/[^0-9]+/g,'');
            return Number(digits||0);
          }
          function groupCatalogProducts(products){
            const groups=new Map();
            for(const source of products||[]){
              const key=productGroupKey(source)||String(source?.id||source?.url||Math.random());
              const incoming=Array.isArray(source?.variants)&&source.variants.length?source.variants:[source];
              if(!groups.has(key))groups.set(key,{...source,variants:[]});
              const group=groups.get(key);
              group.variants.push(...incoming);
              const currentPrice=productNumericPrice(group);
              const incomingPrice=productNumericPrice(source);
              if(incomingPrice>0&&(!currentPrice||incomingPrice<currentPrice)){
                const variants=group.variants;
                Object.assign(group,source,{variants});
              }
            }
            return [...groups.values()].map(group=>{
              const seen=new Set();
              group.variants=group.variants.filter(item=>{
                const key=String(item?.id||item?.url||item?.name);
                if(seen.has(key))return false;
                seen.add(key);return true;
              });
              const price=productNumericPrice(group);
              if(price>0){group.price=price;group.priceText=`от ${money(price)}`;}
              if(group.variants.length>1)group.meta=`${group.variants.length} вариантов · цены и размеры внутри`;
              return group;
            });
          }
          /* ONLYFLORA_GROUPING_END */
          '''
          render_needle = "function renderProductList(products,{status='Живой каталог',total=products.length}={}){\n"
          if render_needle not in app:
              raise SystemExit("product list renderer was not found in app.js")
          app = app.replace("  products = groupCatalogProducts(products);\n", "")
          app = app.replace(render_needle, grouping + render_needle + "  products = groupCatalogProducts(products);\n", 1)

          old_snapshot = "const offers=offersFromSnapshot(snapshot,product,names[0]);"
          new_snapshot = "const variants=Array.isArray(product.variants)&&product.variants.length?product.variants:[product];\n      const offers=variants.flatMap(variant=>offersFromSnapshot(snapshot,variant,names[0]));"
          app = app.replace(old_snapshot, new_snapshot)
          if new_snapshot not in app:
              raise SystemExit("grouped product offer lookup was not added to app.js")

          # Android WebView receives fresh application code directly and does
          # not install the browser PWA service worker into its private cache.
          app = re.sub(
              r"if\('serviceWorker'in navigator(?:&&[^)]*)?\)navigator\.serviceWorker\.register\('/sw\.js\?v=\d+'\);",
              "if('serviceWorker'in navigator&&!/OnlyFloraAndroid\\//.test(navigator.userAgent))navigator.serviceWorker.register('/sw.js?v=40');",
              app,
          )

          if "/mobile/api/" not in app:
              raise SystemExit("mobile API resolver was not added to app.js")
          if app.count("const ONLYFLORA_API_ORIGIN =") != 1:
              raise SystemExit("mobile API resolver must occur exactly once")
          app_path.write_text(app, encoding="utf-8")

          styles_path = Path("public/styles.css")
          styles = styles_path.read_text(encoding="utf-8")
          android_rule = ".onlyflora-android .app-shell{padding-top:0!important}"
          product_scroll_rule = ".product-view{padding-bottom:220px!important;scroll-padding-bottom:190px}"
          styles = styles.replace(android_rule, "").replace(product_scroll_rule, "")
          styles += "\n" + android_rule + "\n" + product_scroll_rule + "\n"
          styles_path.write_text(styles, encoding="utf-8")

          index_path = Path("public/index.html")
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(r"app\.js\?v=\d+", "app.js?v=32", index)
          index = re.sub(r"styles\.css\?v=\d+", "styles.css?v=17", index)
          index = index.replace(
              "https://onlyflora.ru/about/privacy-policy/",
              "https://app.onlyflora.ru/privacy/",
          )
          index = index.replace(
              "https://onlyflora.ru/site/marketplace-rules/",
              "https://app.onlyflora.ru/marketplace-rules/",
          )
          if "https://app.onlyflora.ru/account-deletion/" not in index:
              index = re.sub(
                  r'(</a>\s*</nav>)',
                  r'</a>\n                <a href="https://app.onlyflora.ru/account-deletion/" target="_blank" rel="noopener">Удаление аккаунта и данных <i>↗</i></a>\n              </nav>',
                  index,
              )
          if "Фото и файлы передаются только для распознавания" not in index:
              index = index.replace(
                  '<div class="assistant-note"><b>Важно:</b> возраст, высота, контейнер и обхват сохраняются раздельно. Замены показываются отдельно.</div>',
                  '<div class="assistant-note"><b>Важно:</b> возраст, высота, контейнер и обхват сохраняются раздельно. Замены показываются отдельно.</div>\n'
                  '          <div class="assistant-note">Фото и файлы передаются только для распознавания списка растений. Не загружайте документы с персональными данными. <a href="https://app.onlyflora.ru/privacy/" target="_blank" rel="noopener">Подробнее о защите данных</a>.</div>',
              )
          index_path.write_text(index, encoding="utf-8")

          sw_path = Path("public/sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = re.sub(r"onlyflora-mobile-v\d+", "onlyflora-mobile-v40", sw)
          sw = re.sub(r"app\.js\?v=\d+", "app.js?v=32", sw)
          sw = re.sub(r"styles\.css\?v=\d+", "styles.css?v=17", sw)
          network_only = "if(new URL(event.request.url).origin!==self.location.origin){event.respondWith(fetch(event.request));return}\n  "
          if network_only not in sw:
              sw = sw.replace("if(event.request.method!=='GET')return;\n  ", "if(event.request.method!=='GET')return;\n  " + network_only, 1)
          legal_network_only = "if(['/privacy/','/account-deletion/','/marketplace-rules/'].includes(new URL(event.request.url).pathname)){event.respondWith(fetch(event.request));return}\n  "
          if legal_network_only not in sw:
              sw = sw.replace(network_only, network_only + legal_network_only, 1)
          sw_path.write_text(sw, encoding="utf-8")
          PY
          node --check public/app.js
          cp -R mobile-static/. public/
          # Publish Android 1.0.2 at the stable, user-friendly URL.
          mkdir -p public/downloads
          cp downloads/OnlyFlora.apk public/downloads/OnlyFlora.apk
          touch public/.nojekyll
          printf '%s\n' 'app.onlyflora.ru' > public/CNAME
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload application
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
