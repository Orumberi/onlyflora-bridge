plugins {
    id "com.android.application"
}

def onlyFloraAppUrl = providers.gradleProperty("ONLYFLORA_APP_URL")
        .orElse("https://app.onlyflora.ru/?source=android")
        .get()
def releaseKeystorePath = providers.environmentVariable("ANDROID_KEYSTORE_PATH").orNull
def releaseKeystorePassword = providers.environmentVariable("ANDROID_KEYSTORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("ANDROID_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("ANDROID_KEY_PASSWORD").orNull

android {
    namespace "ru.onlyflora.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "ru.onlyflora.mobileapp"
        minSdk 24
        targetSdk 36
        versionCode 10002
        versionName "1.0.2"
        buildConfigField "String", "APP_URL", "\"${onlyFloraAppUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
